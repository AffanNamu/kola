name: Kolanut Build & Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js for Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and compile Firebase Functions
        run: |
          cd functions
          npm install
          npm run build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      # Firebase Android options are maintained in lib/firebase_options.dart.
      # No google-services.json is required because this project initializes
      # Firebase using explicit FirebaseOptions and does not apply the
      # Google Services Gradle plugin.

      - name: Create cloudinary_constants.dart
        run: |
          cat > lib/core/constants/cloudinary_constants.dart << 'EOF'
          class CloudinaryConstants {
            static const String cloudName = '${{ secrets.CLOUDINARY_CLOUD_NAME }}';
            static const String apiKey = '${{ secrets.CLOUDINARY_API_KEY }}';
            static const String uploadPreset = '${{ secrets.CLOUDINARY_UPLOAD_PRESET }}';
            static const String baseUrl = 'https://api.cloudinary.com/v1_1';
            static const String productsFolder = 'kolanut/products';
            static const String categoriesFolder = 'kolanut/categories';
            static const String bannersFolder = 'kolanut/banners';
            static const String usersFolder = 'kolanut/users';
            static const String reviewsFolder = 'kolanut/reviews';
          }
          EOF

      - name: Create payment_constants.dart
        run: |
          cat > lib/core/constants/payment_constants.dart << 'EOF'
          class PaymentConstants {
            static const String paystackPublicKey = '${{ secrets.PAYSTACK_PUBLIC_KEY }}';
            static const String flutterwavePublicKey = '${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}';
            static const String currency = 'USD';
            static const String paystackBaseUrl = 'https://api.paystack.co';
            static const String flutterwaveBaseUrl = 'https://api.flutterwave.com/v3';
          }
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "::warning::No test/ directory exists yet; skipping Flutter tests."
          fi

      - name: Build APK (Debug)
        run: flutter build apk --debug --dart-define=SUPABASE_VERIFY_BASE_URL=${{ secrets.SUPABASE_VERIFY_BASE_URL }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Report Android OAuth signing fingerprints
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk

      - name: Restore permanent Android release keystore
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 GitHub secret is not configured."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/kolanut-release.jks
          test -s android/app/kolanut-release.jks

      - name: Build APK (Release)
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_PATH: kolanut-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=SUPABASE_VERIFY_BASE_URL=${{ secrets.SUPABASE_VERIFY_BASE_URL }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Report permanent release signing fingerprints
        if: github.ref == 'refs/heads/main'
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "Fingerprint for $APK"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs "$APK"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kolanut-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APKs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kolanut-release-apks
          path: build/app/outputs/flutter-apk/*.apk
