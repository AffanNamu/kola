name: Kolanut Build & Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js for Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and compile Firebase Functions
        run: |
          cd functions
          npm install
          npm run build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      # Firebase Android options are maintained in lib/firebase_options.dart.
      # No google-services.json is required because this project initializes
      # Firebase using explicit FirebaseOptions and does not apply the
      # Google Services Gradle plugin.

      - name: Create cloudinary_constants.dart
        run: |
          cat > lib/core/constants/cloudinary_constants.dart << 'EOF'
          class CloudinaryConstants {
            static const String cloudName = '${{ secrets.CLOUDINARY_CLOUD_NAME }}';
            static const String apiKey = '${{ secrets.CLOUDINARY_API_KEY }}';
            static const String uploadPreset = '${{ secrets.CLOUDINARY_UPLOAD_PRESET }}';
            static const String baseUrl = 'https://api.cloudinary.com/v1_1';
            static const String productsFolder = 'kolanut/products';
            static const String categoriesFolder = 'kolanut/categories';
            static const String bannersFolder = 'kolanut/banners';
            static const String usersFolder = 'kolanut/users';
            static const String reviewsFolder = 'kolanut/reviews';
          }
          EOF

      - name: Create payment_constants.dart
        run: |
          cat > lib/core/constants/payment_constants.dart << 'EOF'
          class PaymentConstants {
            static const String paystackPublicKey = '${{ secrets.PAYSTACK_PUBLIC_KEY }}';
            static const String flutterwavePublicKey = '${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}';
            static const String currency = 'USD';
            static const String paystackBaseUrl = 'https://api.paystack.co';
            static const String flutterwaveBaseUrl = 'https://api.flutterwave.com/v3';
          }
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "::warning::No test/ directory exists yet; skipping Flutter tests."
          fi

      - name: Build APK (Debug)
        run: flutter build apk --debug --dart-define=SUPABASE_VERIFY_BASE_URL=${{ secrets.SUPABASE_VERIFY_BASE_URL }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Report Android OAuth signing fingerprints
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk

      - name: Register Android signing fingerprints with Firebase
        if: github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          CERT_OUTPUT=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk)
          export KOLA_SHA1=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)
          export KOLA_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          node <<'NODE'
          const crypto = require('node:crypto');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '{}');
          if (!sa.client_email || !sa.private_key) {
            throw new Error('FIREBASE_SERVICE_ACCOUNT_JSON is missing or invalid.');
          }
          const b64url = value => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' })) + '.' +
            b64url(JSON.stringify({
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/firebase',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600
            }));
          const signer = crypto.createSign('RSA-SHA256');
          signer.update(unsigned);
          const assertion = unsigned + '.' + signer.sign(sa.private_key, 'base64url');
          (async () => {
            const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion
              })
            });
            const tokenData = await tokenResponse.json();
            if (!tokenResponse.ok) throw new Error('Google token exchange failed: ' + JSON.stringify(tokenData));
            const parent = 'projects/kola-7523f/androidApps/1:507347665820:android:a602b2acc216d54f8b7e59';
            const base = 'https://firebase.googleapis.com/v1beta1/' + parent + '/sha';
            for (const [shaHash, certType] of [[process.env.KOLA_SHA1, 'SHA_1'], [process.env.KOLA_SHA256, 'SHA_256']]) {
              if (!shaHash) throw new Error('Could not extract ' + certType + ' from the built APK.');
              const headers = { authorization: 'Bearer ' + tokenData.access_token, 'content-type': 'application/json' };
              const existingResponse = await fetch(base, { headers });
              const existing = await existingResponse.json();
              if (!existingResponse.ok) throw new Error('Could not read Firebase SHA certificates: ' + JSON.stringify(existing));
              if ((existing.certificates || []).some(item => item.shaHash?.toLowerCase() === shaHash.toLowerCase())) {
                console.log(certType + ' already registered in Firebase.');
                continue;
              }
              const response = await fetch(base, {
                method: 'POST',
                headers,
                body: JSON.stringify({ name: '', shaHash, certType })
              });
              const result = await response.json();
              if (!response.ok) throw new Error('Firebase SHA registration failed: ' + JSON.stringify(result));
              console.log(certType + ' registered in Firebase: ' + shaHash);
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Build APK (Release)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_VERIFY_BASE_URL=${{ secrets.SUPABASE_VERIFY_BASE_URL }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kolanut-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APKs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kolanut-release-apks
          path: build/app/outputs/flutter-apk/*.apk
