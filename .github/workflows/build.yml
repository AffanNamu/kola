name: Kolanut Build & Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Create firebase_options.dart
        run: |
          cat > lib/firebase_options.dart << 'EOF'
          ${{ secrets.FIREBASE_OPTIONS_DART }}
          EOF

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create cloudinary_constants.dart
        run: |
          cat > lib/core/constants/cloudinary_constants.dart << 'EOF'
          class CloudinaryConstants {
            static const String cloudName = '${{ secrets.CLOUDINARY_CLOUD_NAME }}';
            static const String apiKey = '${{ secrets.CLOUDINARY_API_KEY }}';
            static const String uploadPreset = '${{ secrets.CLOUDINARY_UPLOAD_PRESET }}';
            static const String baseUrl = 'https://api.cloudinary.com/v1_1';
            static const String productsFolder = 'kolanut/products';
            static const String categoriesFolder = 'kolanut/categories';
            static const String bannersFolder = 'kolanut/banners';
            static const String usersFolder = 'kolanut/users';
            static const String reviewsFolder = 'kolanut/reviews';
          }
          EOF

      - name: Create payment_constants.dart
        run: |
          cat > lib/core/constants/payment_constants.dart << 'EOF'
          class PaymentConstants {
            static const String paystackPublicKey = '${{ secrets.PAYSTACK_PUBLIC_KEY }}';
            static const String flutterwavePublicKey = '${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}';
            static const String currency = 'USD';
            static const String paystackBaseUrl = 'https://api.paystack.co';
            static const String flutterwaveBaseUrl = 'https://api.flutterwave.com/v3';
          }
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get --ignore-deprecation

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK (Debug)
        run: flutter build apk --debug --dart-define=SUPABASE_VERIFY_BASE_URL=${{ secrets.SUPABASE_VERIFY_BASE_URL }}

      - name: Build APK (Release)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_VERIFY_BASE_URL=${{ secrets.SUPABASE_VERIFY_BASE_URL }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kolanut-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APKs
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: kolanut-release-apks
          path: build/app/outputs/flutter-apk/*.apk
