name: Deploy Firestore Rules and Indexes

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy_firestore_rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Firestore configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Firebase configuration
        run: |
          test -f firebase.json
          test -f firestore.rules
          test -f firestore.indexes.json
          jq empty firebase.json
          jq empty firestore.indexes.json

      - name: Create service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON repository secret is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          jq -e '.type == "service_account" and .project_id == "kola-7523f" and (.client_email | type == "string") and (.private_key | type == "string")' "$RUNNER_TEMP/firebase-sa.json" >/dev/null
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy Firestore security rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:rules \
            --project kola-7523f \
            --non-interactive

      - name: Deploy Firestore indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:indexes \
            --project kola-7523f \
            --non-interactive


      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
